# ============================================================================
# RAILWAY AUTO-DEPLOYMENT - Frontend Service
# ============================================================================
# Triggers: Push to main branch, manual workflow dispatch
# Purpose: Automatically deploy frontend to Railway on code changes
# Build: Vite production build with environment-based configuration
# ============================================================================

name: Deploy Frontend to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'index.html'
      - 'nginx.conf'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preprod
          - staging

env:
  # Soft-coded deployment configuration
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

jobs:
  # ============================================================================
  # JOB 1: BUILD & VALIDATE FRONTEND
  # ============================================================================
  build:
    name: Build Frontend Assets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint || echo "⚠️ Linting issues found but continuing..."
        continue-on-error: true
        
      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production
          
      - name: Check build output
        run: |
          echo "📦 Build output:"
          ls -lah dist/
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 1

  # ============================================================================
  # JOB 2: DEPLOY TO RAILWAY
  # ============================================================================
  deploy:
    name: Deploy to Railway (${{ github.event.inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          
      - name: Deploy to Railway
        run: |
          railway link ${{ secrets.RAILWAY_PROJECT_ID }}
          railway up --service frontend --environment ${{ env.DEPLOY_ENVIRONMENT }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          
      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for Railway deployment..."
          sleep 30

  # ============================================================================
  # JOB 3: VERIFY DEPLOYMENT
  # ============================================================================
  verify:
    name: Verify Frontend Deployment
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Check frontend availability
        run: |
          FRONTEND_URL="${{ secrets.RAILWAY_FRONTEND_URL }}"
          echo "🌐 Checking frontend: $FRONTEND_URL"
          
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" $FRONTEND_URL || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Frontend is live (HTTP $STATUS)"
              exit 0
            fi
            echo "⏳ Attempt $i/10: HTTP $STATUS - Waiting 10s..."
            sleep 10
          done
          
          echo "❌ Frontend health check failed after 10 attempts"
          exit 1
        continue-on-error: true

  # ============================================================================
  # JOB 4: NOTIFICATION
  # ============================================================================
  notify:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy, verify]
    if: always()
    
    steps:
      - name: Deployment Report
        run: |
          echo "📦 Frontend Deployment Summary"
          echo "==============================="
          echo "Environment: ${{ env.DEPLOY_ENVIRONMENT }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Status: ${{ job.status }}"
          echo "==============================="

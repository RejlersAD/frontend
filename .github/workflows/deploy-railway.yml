# ============================================================================
# FRONTEND VALIDATION - Railway deploys through its native GitHub integration
# ============================================================================
# Triggers: Push to main branch, manual workflow dispatch
# Purpose: Validate frontend changes while Railway handles deployment natively
# ============================================================================

name: Validate Frontend for Railway

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'vite.config.js'
      - 'tailwind.config.js'
      - 'index.html'
      - 'nginx.conf'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Frontend Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check build output
        run: ls -lah dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 1
